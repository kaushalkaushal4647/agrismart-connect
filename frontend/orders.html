<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Delivery Tracking - AgriSmart Connect</title>
    <meta name="description" content="Track your agricultural produce orders, collection hub processing, and delivery status in real-time.">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-header {
            background: var(--white);
            border-bottom: 1px solid var(--slate-200);
            padding: 2.2rem 0;
            margin-bottom: 2rem;
        }
        .status-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 0.25rem 0.65rem;
            border-radius: var(--radius-full);
            letter-spacing: 0.5px;
        }
        .badge-available { background: #dcfce7; color: #166534; }
        .badge-open { background: #e0f2fe; color: #0369a1; }
        .badge-matched { background: #fef3c7; color: #92400e; }
        .badge-paid { background: #ede9fe; color: #5b21b6; }
        .badge-danger { background: #fee2e2; color: #991b1b; }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-content {
            background: var(--white);
            border-radius: var(--radius-lg);
            width: 100%;
            box-shadow: var(--shadow-xl);
            padding: 2rem;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--slate-200);
            padding-bottom: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="logo-icon">🌱</div>
                <span>AgriSmart<span style="color:var(--primary-light);">Connect</span></span>
            </a>

            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/marketplace.html" class="nav-link">Marketplace</a></li>
                <li><a href="/orders.html" class="nav-link active">My Orders</a></li>
                <li><a href="/restaurant.html" class="nav-link">Bulk B2B</a></li>
            </ul>

            <div class="nav-actions" id="nav-auth-actions">
                <!-- Populated dynamically by api.js -->
            </div>
        </div>
    </header>

    <!-- HEADER -->
    <section class="page-header">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
            <div>
                <span class="section-badge">Fulfillment Pipeline</span>
                <h1 style="font-size:2rem;margin-bottom:0.25rem;">Active Orders & Live Tracking</h1>
                <p style="color:var(--slate-500);font-size:0.95rem;">Monitor farm collection, hub quality inspection, packing, and dispatch.</p>
            </div>
            <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
                <button class="btn btn-outline btn-sm" onclick="autoSimulateAllOrders()" title="Simulate stage-by-stage real-time delivery movement">
                    🚚 Simulate Live Pipeline
                </button>
                <a href="/marketplace.html" class="btn btn-primary btn-sm">+ Order More Produce</a>
            </div>
        </div>
    </section>

    <!-- ORDERS CONTAINER -->
    <main class="container" style="padding-bottom: 4rem;">
        <div id="orders-list-container">
            <!-- Rendered by orders.js -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-content">
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <div class="logo-icon" style="width:28px;height:28px;font-size:0.9rem;">🌱</div>
                <span style="font-weight:700;color:var(--slate-800);">AgriSmart Connect</span>
                <span>© 2026</span>
            </div>
            <ul class="footer-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/marketplace.html">Marketplace</a></li>
                <li><a href="/orders.html">Orders</a></li>
            </ul>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/voice-guidance.js"></script>
    <script src="/js/orders.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.AgriVoice) window.AgriVoice.attachPageHeaderVoice('tracking');
        });
    </script>
</body>
</html>
